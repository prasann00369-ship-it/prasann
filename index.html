<style>:root{--g:#0b3a1f;--o:#ff6b0a;--c:#fbf6ea;--tx:#1d2a20}*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Noto Serif Devanagari',serif;background:var(--c);color:var(--tx);line-height:1.5}

label{display:block;margin:.7rem 0;font-weight:700}input,textarea,select{width:100%;padding:.7rem;border:1.5px solid #b9c4b5;border-radius:12px;margin-top:.25rem;background:#fff}.err{color:#b00020;font-size:.85rem;font-weight:400;min-height:1em}.small{font-size:.85rem;color:#44524a}.chk{display:flex;gap:.6rem;font-weight:400}.chk input{width:auto;margin-top:.3rem}
.demo{background:#fff3cd;border:2px solid var(--o);border-radius:12px;padding:.7rem;font-weight:700;margin-bottom:1rem}
header{background:var(--g);color:#fff;display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;position:sticky;top:0;z-index:5;flex-wrap:wrap}header img{height:48px;width:48px}header b{font-size:1.3rem;letter-spacing:.08em;flex:1}header input{max-width:260px;flex:1 1 140px;margin:0}.hb{background:transparent;color:#fff;border:1.5px solid #fff;border-radius:999px;padding:.4rem .9rem;cursor:pointer;min-height:40px}
.hero{background:linear-gradient(135deg,var(--g),#145a30);color:#fff;text-align:center;padding:3rem 1rem}.hero h1{margin:0 0 .5rem;font-size:clamp(1.6rem,5vw,2.8rem)}.hero p{color:#ffd9bd}
section{max-width:1000px;margin:auto;padding:1.5rem 1rem}h2{color:var(--g)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.cat{background:#fff;border:2px solid #e3dcc7;border-radius:18px;padding:1rem;text-align:center}.soon{display:block;color:var(--o);font-size:.85rem;margin-top:.3rem}
.card{background:#fff;border-radius:20px;padding:1rem;box-shadow:0 4px 16px #0b3a1f18}.ph{background:#eee9db;color:#6b6552;border-radius:14px;height:150px;display:grid;place-items:center;text-align:center;padding:.5rem}.warn{color:#9a4a00;font-weight:700}
#cartPanel{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:#fff;padding:1rem;overflow:auto;transform:translateX(100%);transition:.3s;z-index:20;box-shadow:-6px 0 20px #0004}#cartPanel.open{transform:none}
.line{display:flex;justify-content:space-between;gap:.5rem;border-bottom:1px solid #eee;padding:.6rem 0}.sm{border:1px solid #999;background:#fff;border-radius:8px;min-width:40px;min-height:40px;margin:2px;cursor:pointer}
footer{background:var(--g);color:#fff;text-align:center;padding:1.5rem}footer a{color:#ffd9bd;margin:0 .6rem}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30;padding:1rem}#modal[hidden]{display:none}[hidden]{display:none!important}</style></head><body>
