<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PRASANN Admin</title>

<style>
:root{--g:#1f4d2b;--o:#f28c28;--c:#fbf6ea;--r:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--c);color:#222}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}
main{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px #0002}
h2{margin:0 0 10px;color:var(--g);font-size:17px}
h3{font-size:16px;margin:18px 0 8px;color:var(--g)}
label{display:block;font-size:13px;margin:8px 0 3px;color:#555}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:var(--o);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;margin-top:10px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button.s{background:var(--g)}
button.d{background:var(--r)}
button.l{background:transparent;border:1px solid #fff;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{margin:0;flex:1;background:#ddd;color:#222}
.tabs button.on{background:var(--g);color:#fff}
.row{display:flex;gap:10px;align-items:center;border-top:1px solid #eee;padding:10px 0}
.row img,.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eee;font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center;flex:none}
.row div.i{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.row small{color:#666;display:block}
.row button{margin:0;padding:7px 10px;font-size:13px}
#msg{position:fixed;bottom:12px;left:12px;right:12px;padding:12px;border-radius:8px;color:#fff;display:none;text-align:center;z-index:10;overflow-wrap:anywhere}
.hide{display:none!important}
.pack{border:1px solid #e3e3e3;border-radius:10px;padding:10px;margin:10px 0;background:#fffdf8}
.pack-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pack-head b{color:var(--g);font-size:14px}
.pack-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack-fields label{margin-top:5px}
.pack-head button{margin:0}
.note{font-size:12px;color:#666;margin:6px 0}
@media(max-width:420px){.pack-fields{grid-template-columns:1fr 1fr}.row{gap:6px}.row button{padding:7px;font-size:12px}}
</style>
</head>

<body>
<header>
  <b>PRASANN Admin</b>
  <button class="l hide" id="out" onclick="logout()">Logout</button>
</header>

<main>
  <div id="login" class="card">
    <h2>Admin Login</h2>
    <label>Email</label>
    <input id="em" type="email" autocomplete="username">
    <label>Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button onclick="login()">Login</button>
  </div>

  <div id="app" class="hide">
    <div class="tabs">
      <button id="t1" class="on" onclick="tab(1)">Products</button>
      <button id="t2" onclick="tab(2)">Stories (24h)</button>
    </div>

    <div id="p1">
      <div class="card">
        <h2 id="ptitle">नया Product</h2>

        <label>Name (English)</label>
        <input id="pn" autocomplete="off">

        <label>नाम (हिंदी)</label>
        <input id="ph" autocomplete="off">

        <label>Product Description / प्रोडक्ट का विवरण</label>
        <textarea id="pd" rows="3" placeholder="प्रोडक्ट की जानकारी लिखें"></textarea>

        <label>Product Video URL (Optional)</label>
        <input id="pvideo" type="url" placeholder="वीडियो का लिंक">

        <label>Category</label>
        <select id="pc">
          <option>Snacks</option>
          <option>Indian Meals</option>
          <option>South Indian Meals</option>
          <option>Fast Food</option>
          <option>Sweets</option>
        </select>

        <h3>Pack Options / पैक और कीमत</h3>
        <p class="note">हर पैक का वजन और कीमत अलग भरें। जरूरत के अनुसार जितने चाहें पैक जोड़ें।</p>

        <div id="packs"></div>
        <button type="button" class="s" onclick="addPack()">+ Add Pack</button>

        <label>Status</label>
        <select id="ps">
          <option value="available">Available</option>
          <option value="coming_soon">Coming Soon</option>
        </select>

        <label>Product Photo (अनिवार्य)</label>
        <input id="pf" type="file" accept="image/*">
        <p id="photoNote" class="note">नया प्रोडक्ट जोड़ने के लिए फोटो जरूरी है।</p>

        <button class="s" id="saveBtn" onclick="saveP()">Save</button>
        <button type="button" onclick="resetP()" style="background:#999">Clear</button>
      </div>

      <div class="card">
        <h2>सभी Products</h2>
        <div id="plist">लोड हो रहे हैं...</div>
      </div>
    </div>

    <div id="p2" class="hide">
      <div class="card">
        <h2>नई Story (24 घंटे बाद अपने आप हट जाएगी)</h2>
        <label>Photo</label>
        <input id="sf" type="file" accept="image/*">
        <label>Caption</label>
        <input id="sc">
        <button class="s" onclick="saveS()">Publish Story</button>
      </div>

      <div class="card">
        <h2>Live Stories</h2>
        <div id="slist"></div>
      </div>
    </div>
  </div>
</main>

<div id="msg" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<script>
const C = window.PRASANN_CONFIG;
let sb = null;
let editId = null;
let editImg = null;
let prods = [];
let packCounter = 0;

const $ = id => document.getElementById(id);

function msg(text, bad = false) {
  const el = $('msg');
  el.textContent = text;
  el.style.background = bad ? '#b3261e' : '#1f4d2b';
  el.style.display = 'block';
  clearTimeout(msg.timer);
  msg.timer = setTimeout(() => {
    el.style.display = 'none';
  }, 4000);
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));

function tab(n) {
  $('p1').classList.toggle('hide', n !== 1);
  $('p2').classList.toggle('hide', n !== 2);
  $('t1').className = n === 1 ? 'on' : '';
  $('t2').className = n === 2 ? 'on' : '';
}

function addPack(grams = '', price = '') {
  packCounter++;
  const id = packCounter;
  const box = document.createElement('div');
  box.className = 'pack';
  box.dataset.packId = id;

  box.innerHTML = `
    <div class="pack-head">
      <b class="pack-title">Pack</b>
      <button type="button" class="d" data-remove="${id}">Remove</button>
    </div>
    <div class="pack-fields">
      <div>
        <label>वजन (ग्राम)</label>
        <input class="pack-grams" type="number" min="1" step="any"
          placeholder="जैसे 100" value="${esc(grams)}">
      </div>
      <div>
        <label>कीमत (₹)</label>
        <input class="pack-price" type="number" min="0.01" step="0.01"
          placeholder="जैसे 99" value="${esc(price)}">
      </div>
    </div>
  `;

  box.querySelector('[data-remove]').addEventListener('click', () => {
    box.remove();
    numberPacks();
  });

  $('packs').appendChild(box);
  numberPacks();
}

function numberPacks() {
  [...$('packs').querySelectorAll('.pack')].forEach((el, index) => {
    el.querySelector('.pack-title').textContent = 'Pack ' + (index + 1);
  });
}

function clearPacks() {
  $('packs').innerHTML = '';
  packCounter = 0;
  addPack();
}

function readPacks() {
  const result = [];
  const seen = new Set();

  for (const el of $('packs').querySelectorAll('.pack')) {
    const gramsText = el.querySelector('.pack-grams').value.trim();
    const priceText = el.querySelector('.pack-price').value.trim();

    if (gramsText === '' && priceText === '') continue;

    if (gramsText === '' || priceText === '') {
      throw new Error('हर पैक का वजन और कीमत दोनों भरें।');
    }

    const grams = Number(gramsText);
    const price = Number(priceText);

    if (!Number.isFinite(grams) || grams <= 0 ||
        !Number.isFinite(price) || price <= 0) {
      throw new Error('हर पैक का वजन और कीमत शून्य से अधिक भरें।');
    }

    if (seen.has(grams)) {
      throw new Error('एक ही वजन के दो पैक न रखें।');
    }

    seen.add(grams);
    result.push({ grams, price });
  }

  return result;
}

function parsePacks(value) {
  if (Array.isArray(value)) return value;
  if (typeof value === 'string') {
    try {
      const parsed = JSON.parse(value);
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      return [];
    }
  }
  return [];
}

async function init() {
  if (!C || !C.SUPABASE_URL || !C.SUPABASE_ANON_KEY ||
      C.SUPABASE_URL.startsWith('YOUR')) {
    msg('config.js में Supabase URL और anon key जाँचें।', true);
    return;
  }

  sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);

  const { data, error } = await sb.auth.getSession();
  if (error) return msg(error.message, true);
  if (data.session) await enter();
}

async function login() {
  if (!sb) return msg('पहले config.js की जाँच करें।', true);

  const email = $('em').value.trim();
  const password = $('pw').value;

  if (!email || !password) return msg('Email और Password भरें।', true);

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return msg('Login फेल: ' + error.message, true);

  await enter();
}

async function enter() {
  const { data: userData, error: userError } = await sb.auth.getUser();
  if (userError || !userData.user) {
    await sb.auth.signOut();
    return msg('User verify नहीं हो पाया। दोबारा Login करें।', true);
  }

  const { data, error } = await sb
    .from('admins')
    .select('user_id')
    .eq('user_id', userData.user.id)
    .maybeSingle();

  if (error) {
    await sb.auth.signOut();
    return msg('Admin जाँच में समस्या: ' + error.message, true);
  }

  if (!data) {
    await sb.auth.signOut();
    return msg('यह account admin नहीं है।', true);
  }

  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('out').classList.remove('hide');

  await loadP();
  await loadS();
}

async function logout() {
  if (sb) await sb.auth.signOut();
  location.reload();
}

async function up(file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const name = Date.now() + '-' +
    Math.random().toString(36).slice(2, 8) + '-' + safeName;

  const { error } = await sb.storage
    .from('product-images')
    .upload(name, file);

  if (error) throw error;

  return sb.storage.from('product-images').getPublicUrl(name).data.publicUrl;
}

async function loadP() {
  const { data, error } = await sb
    .from('products')
    .select('*')
    .order('created_at');

  if (error) return msg(error.message, true);

  prods = data || [];

  $('plist').innerHTML = prods.map(p => `
    <div class="row">
      ${p.image_url
        ? `<img src="${esc(p.image_url)}" alt="">`
        : '<div class="ph">Photo coming soon</div>'}
      <div class="i">
        <b>${esc(p.name)}</b>
        <small>${esc(p.category)} • ${
          p.status === 'available' ? 'Available' : 'Coming Soon'
        }</small>
      </div>
      <button class="s" onclick="editP('${esc(p.id)}')">Edit</button>
      <button class="d" onclick="delP('${esc(p.id)}')">Delete</button>
    </div>
  `).join('') || 'कोई product नहीं';
}

function resetP() {
  editId = null;
  editImg = null;

  ['pn','ph','pd','pvideo','pf'].forEach(id => $(id).value = '');
  $('pc').value = 'Snacks';
  $('ps').value = 'available';
  $('ptitle').textContent = 'नया Product';
  $('photoNote').textContent = 'नया प्रोडक्ट जोड़ने के लिए फोटो जरूरी है।';
  $('saveBtn').textContent = 'Save';

  clearPacks();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function editP(id) {
  const p = prods.find(x => String(x.id) === String(id));
  if (!p) return msg('Product नहीं मिला।', true);

  editId = p.id;
  editImg = p.image_url || null;

  $('pn').value = p.name || '';
  $('ph').value = p.name_hi || '';
  $('pd').value = p.description || '';
  $('pvideo').value = p.video_url || '';
  $('pc').value = p.category || 'Snacks';
  $('ps').value = p.status || 'available';
  $('pf').value = '';

  $('ptitle').textContent = 'Edit: ' + (p.name || 'Product');
  $('photoNote').textContent = editImg
    ? 'पुरानी फोटो बनी रहेगी। बदलने के लिए नई फोटो चुनें।'
    : 'इस प्रोडक्ट के लिए फोटो चुनें।';
  $('saveBtn').textContent = 'Update Product';

  $('packs').innerHTML = '';
  packCounter = 0;

  const packs = parsePacks(p.pack_options || p.packs);
  if (packs.length) {
    packs.forEach(pack => addPack(pack.grams ?? '', pack.price ?? ''));
  } else {
    addPack();
  }

  tab(1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function saveP() {
  const button = $('saveBtn');

  try {
    if (!sb) throw new Error('Supabase कनेक्शन उपलब्ध नहीं है।');

    const name = $('pn').value.trim();
    if (!name) throw new Error('Product का नाम जरूरी है।');

    const f = $('pf').files[0];
    if (!f && !editImg) {
      throw new Error('पहले Product की फोटो चुनें।');
    }

    const packs = readPacks();
    if (!packs.length) {
      throw new Error('कम से कम एक पैक और उसकी कीमत भरें।');
    }

    const video = $('pvideo').value.trim();
    if (video) {
      try {
        const parsed = new URL(video);
        if (!['http:', 'https:'].includes(parsed.protocol)) {
          throw new Error();
        }
      } catch (_) {
        throw new Error('Video URL सही नहीं है।');
      }
    }

    button.disabled = true;
    button.textContent = 'Saving...';

    let img = editImg;

    if (f) {
      msg('फोटो अपलोड हो रही है, कृपया इंतज़ार करें।');
      img = await up(f);
    }

    if (!img) throw new Error('Product फोटो का URL नहीं मिला।');

    const row = {
      name,
      name_hi: $('ph').value.trim() || null,
      category: $('pc').value,
      description: $('pd').value.trim() || null,
      video_url: video || null,
      pack_options: packs,
      status: $('ps').value,
      image_url: img
    };

    msg('Product सेव हो रहा है...');

    const result = editId
      ? await sb.from('products').update(row).eq('id', editId)
      : await sb.from('products').insert(row);

    if (result.error) throw result.error;

    msg('Product सेव हो गया ✅');
    resetP();
    await loadP();

  } catch (e) {
    msg(e.message || 'Product सेव नहीं हो पाया।', true);
  } finally {
    button.disabled = false;
    button.textContent = editId ? 'Update Product' : 'Save';
  }
}

async function delP(id) {
  if (!confirm('क्या यह Product Delete करना है?')) return;

  const { error } = await sb.from('products').delete().eq('id', id);
  if (error) return msg(error.message, true);

  msg('Product Delete हो गया।');
  await loadP();
}

async function loadS() {
  const { data, error } = await sb
    .from('stories')
    .select('*')
    .gt('expires_at', new Date().toISOString())
    .order('created_at', { ascending: false });

  if (error) return msg(error.message, true);

  $('slist').innerHTML = (data || []).map(s => `
    <div class="row">
      <img src="${esc(s.image_url)}" alt="">
      <div class="i">
        ${esc(s.caption || '')}
        <small>खत्म: ${new Date(s.expires_at).toLocaleString()}</small>
      </div>
      <button class="d" onclick="delS('${esc(s.id)}')">Delete</button>
    </div>
  `).join('') || 'कोई live story नहीं';
}

async function saveS() {
  try {
    const f = $('sf').files[0];
    if (!f) return msg('Story की Photo चुनें।', true);

    const url = await up(f);

    const { error } = await sb.from('stories').insert({
      image_url: url,
      caption: $('sc').value.trim() || null,
      expires_at: new Date(Date.now() + 86400000).toISOString()
    });

    if (error) throw error;

    $('sf').value = '';
    $('sc').value = '';
    msg('Story publish हो गई ✅');
    await loadS();

  } catch (e) {
    msg(e.message || 'Story publish नहीं हुई।', true);
  }
}

async function delS(id) {
  if (!confirm('क्या यह Story Delete करनी है?')) return;

  const { error } = await sb.from('stories').delete().eq('id', id);
  if (error) return msg(error.message, true);

  msg('Story Delete हो गई।');
  await loadS();
}

clearPacks();
init();
</script>
</body>
         </html>
